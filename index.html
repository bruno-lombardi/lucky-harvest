<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5db7f2" />
    <meta name="description" content="Lucky Harvest: uma fazendinha isométrica em 3D. Plante, crie bichos, contrate ajudantes e abra a confeitaria da Dona Zefa." />
    <title>Lucky Harvest</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lucky Harvest" />
    <meta property="og:description" content="Uma fazendinha isométrica em 3D, feita à mão em código." />
    <meta property="og:image" content="https://bruno-lombardi.github.io/lucky-harvest/social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Loading screen: lives in the HTML so it paints before any script runs. */
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:linear-gradient(to bottom,#5db7f2 0%,#a6dcfb 55%,#e4f6ff 100%);font-family:'Fredoka Variable','Trebuchet MS',Verdana,sans-serif;
        color:#fff;transition:opacity .55s ease,visibility .55s;overflow:hidden}
      #splash.gone{opacity:0;visibility:hidden;pointer-events:none}
      #splash .hill{position:absolute;left:-10%;right:-10%;bottom:-18vh;height:42vh;border-radius:50% 50% 0 0;background:#7ec850;box-shadow:inset 0 14px 0 #98d963}
      #splash .hill.back{bottom:-14vh;height:40vh;background:#6aa845;box-shadow:none;transform:translateX(18%) scale(.8)}
      #splash .plant{position:relative;z-index:1;width:min(40vw,170px);aspect-ratio:1;transform-origin:50% 90%;animation:splash-sway 2.4s ease-in-out infinite}
      #splash .plant svg{width:100%;height:100%;overflow:visible}
      #splash .coin{transform-box:fill-box;transform-origin:center;animation:splash-pulse 2.4s ease-in-out infinite}
      #splash h1{position:relative;z-index:1;margin:0;line-height:0}
      #splash .wordmark{display:block;width:min(62vw,300px);height:auto}
      #splash .track{position:relative;z-index:1;width:min(64vw,320px);height:20px;border-radius:12px;background:#5a3820;border:3px solid #4a2b0f;box-shadow:0 3px 0 rgba(74,43,15,.35);overflow:hidden}
      #splash .bar{height:100%;width:6%;border-radius:8px;background:linear-gradient(to bottom,#b6ec6c,#6cc23a);transition:width .4s ease-out}
      #splash .msg{position:relative;z-index:1;min-height:1.3em;font-size:clamp(14px,3.6vw,18px);font-weight:500;color:#2d4a1a;text-shadow:0 1px 0 rgba(255,255,255,.7)}
      @keyframes splash-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
      @keyframes splash-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
      @media (prefers-reduced-motion:reduce){#splash .plant,#splash .coin{animation:none}#splash{transition:none}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="hill back"></div><div class="hill"></div>
      <div class="plant" aria-hidden="true">
        <svg viewBox="0 0 128 128"><ellipse cx="66" cy="112" rx="30" ry="8" fill="#8a5527" stroke="#4a2b0f" stroke-width="3.6"/><ellipse cx="66" cy="109.5" rx="21" ry="3.6" fill="#a46a35"/><path d="M64 62 C64 78 70 94 66.4 112" fill="none" stroke="#4a2b0f" stroke-width="9" stroke-linecap="round"/><path d="M64 62 C64 78 70 94 66.4 112" fill="none" stroke="#6cc23a" stroke-width="4.4" stroke-linecap="round"/><path d="M68 90 C86 92 94 82 94 72 C78 72 68 78 68 90Z" fill="#9be35a" stroke="#4a2b0f" stroke-width="3.4" stroke-linejoin="round"/><g transform="translate(64 52) rotate(-45) scale(1.0)"><path d="M0 0 C-6 -3 -17 -10 -17 -22 C-17 -31 -9 -35 -4 -31 C-2 -29 -1 -27 0 -25 C1 -27 2 -29 4 -31 C9 -35 17 -31 17 -22 C17 -10 6 -3 0 0 Z" fill="#6cc23a" stroke="#4a2b0f" stroke-width="4.00" stroke-linejoin="round"/><path d="M-9 -14 C-11 -19 -10 -24 -6 -26" fill="none" stroke="#9be35a" stroke-width="3.00" stroke-linecap="round"/><path d="M0 -3 L0 -22" fill="none" stroke="#4a2b0f" stroke-opacity=".35" stroke-width="1.80" stroke-linecap="round"/></g><g transform="translate(64 52) rotate(45) scale(1.0)"><path d="M0 0 C-6 -3 -17 -10 -17 -22 C-17 -31 -9 -35 -4 -31 C-2 -29 -1 -27 0 -25 C1 -27 2 -29 4 -31 C9 -35 17 -31 17 -22 C17 -10 6 -3 0 0 Z" fill="#3f9a2e" stroke="#4a2b0f" stroke-width="4.00" stroke-linejoin="round"/><path d="M-9 -14 C-11 -19 -10 -24 -6 -26" fill="none" stroke="#6cc23a" stroke-width="3.00" stroke-linecap="round"/><path d="M0 -3 L0 -22" fill="none" stroke="#4a2b0f" stroke-opacity=".35" stroke-width="1.80" stroke-linecap="round"/></g><g transform="translate(64 52) rotate(135) scale(1.0)"><path d="M0 0 C-6 -3 -17 -10 -17 -22 C-17 -31 -9 -35 -4 -31 C-2 -29 -1 -27 0 -25 C1 -27 2 -29 4 -31 C9 -35 17 -31 17 -22 C17 -10 6 -3 0 0 Z" fill="#6cc23a" stroke="#4a2b0f" stroke-width="4.00" stroke-linejoin="round"/><path d="M-9 -14 C-11 -19 -10 -24 -6 -26" fill="none" stroke="#9be35a" stroke-width="3.00" stroke-linecap="round"/><path d="M0 -3 L0 -22" fill="none" stroke="#4a2b0f" stroke-opacity=".35" stroke-width="1.80" stroke-linecap="round"/></g><g transform="translate(64 52) rotate(225) scale(1.0)"><path d="M0 0 C-6 -3 -17 -10 -17 -22 C-17 -31 -9 -35 -4 -31 C-2 -29 -1 -27 0 -25 C1 -27 2 -29 4 -31 C9 -35 17 -31 17 -22 C17 -10 6 -3 0 0 Z" fill="#3f9a2e" stroke="#4a2b0f" stroke-width="4.00" stroke-linejoin="round"/><path d="M-9 -14 C-11 -19 -10 -24 -6 -26" fill="none" stroke="#6cc23a" stroke-width="3.00" stroke-linecap="round"/><path d="M0 -3 L0 -22" fill="none" stroke="#4a2b0f" stroke-opacity=".35" stroke-width="1.80" stroke-linecap="round"/></g><g class="coin"><circle cx="64" cy="52" r="11.00" fill="#f7b928" stroke="#4a2b0f" stroke-width="3.60"/><circle cx="64" cy="52" r="8.14" fill="#ffe98a"/><polygon points="64.00,45.18 65.68,49.69 70.49,49.89 66.72,52.88 68.01,57.52 64.00,54.86 59.99,57.52 61.28,52.88 57.51,49.89 62.32,49.69" fill="#f7b928" stroke="#4a2b0f" stroke-width="1.20" stroke-linejoin="round"/></g></svg>
      </div>
      <h1><img class="wordmark" src="/wordmark.svg" alt="Lucky Harvest" width="306" height="148" /></h1>
      <div class="track"><div class="bar" id="splash-bar"></div></div>
      <div class="msg" id="splash-msg">Preparando a terra…</div>
    </div>
    <div id="game"></div>
    <div id="hud">
      <div class="hud-top">
        <div class="hud-left">
          <div class="hud-stats">
            <div class="badge level">
              <div class="lvl"><span class="star" data-icon="star"></span><span class="label">Nível</span><span id="hud-level" class="num">1</span></div>
              <div class="xpbar"><div class="fill" id="hud-xp-fill"></div></div>
              <div class="xptext" id="hud-xp-text">0/50 XP</div>
            </div>
            <div class="badge coins"><span class="coin" data-icon="coin"></span><span id="hud-coins" class="num">0</span></div>
          </div>
          <button type="button" id="goal-chip" class="goal-chip" hidden></button>
          <div class="clock" aria-label="Hora do dia"><span class="clock-icon" id="hud-clock-icon"></span><span id="hud-time">09:00</span></div>
        </div>
        <div class="hud-right">
          <button type="button" id="shop-btn" class="shop-btn" aria-label="Abrir a loja">
            <span class="shop-pic" data-icon="shop"></span><span class="shop-label">Loja</span>
          </button>
          <div class="hud-round">
            <button type="button" id="book-btn" class="round-btn" aria-label="Livro da Fazenda" title="Livro da Fazenda"><span class="dot" hidden></span></button>
            <button type="button" id="sound-btn" class="round-btn" aria-label="Som" title="Som"></button>
            <button type="button" id="menu-btn" class="round-btn" aria-label="Menu" title="Menu"></button>
          </div>
        </div>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div class="hud-bottom">
        <div class="hud-tile" id="hud-tile">Toque num terreno</div>
        <div id="seed-tray" hidden></div>
        <div id="toolbar"></div>
      </div>
      <div class="hud-hint">Toque no celeiro e nos abrigos · Arraste: mover · Pinça: zoom</div>
    </div>
    <div id="floaters"></div>
    <div id="tip" role="tooltip" hidden></div>
    <div id="shop" hidden></div>
    <div id="barn" hidden></div>
    <div id="pen" hidden></div>
    <div id="tonico" hidden></div>
    <div id="bakery" hidden></div>
    <div id="book" hidden></div>
    <div id="menu" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
