<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7ec850" />
    <title>Lucky Harvest</title>
    <style>
      /* Loading screen: lives in the HTML so it paints before any script runs. */
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:linear-gradient(to bottom,#5db7f2 0%,#a6dcfb 55%,#e4f6ff 100%);font-family:'Fredoka Variable','Trebuchet MS',Verdana,sans-serif;
        color:#fff;transition:opacity .55s ease,visibility .55s;overflow:hidden}
      #splash.gone{opacity:0;visibility:hidden;pointer-events:none}
      #splash .hill{position:absolute;left:-10%;right:-10%;bottom:-18vh;height:42vh;border-radius:50% 50% 0 0;background:#7ec850;box-shadow:inset 0 14px 0 #98d963}
      #splash .hill.back{bottom:-14vh;height:40vh;background:#6aa845;box-shadow:none;transform:translateX(18%) scale(.8)}
      #splash .plant{position:relative;z-index:1;width:min(34vw,150px);aspect-ratio:1;transform-origin:50% 90%;animation:splash-sway 2.4s ease-in-out infinite}
      #splash .plant svg{width:100%;height:100%;overflow:visible}
      #splash .leaf{transform-box:fill-box;transform-origin:50% 100%;animation:splash-grow 2.4s ease-in-out infinite}
      #splash .leaf.b{animation-delay:.25s}
      #splash h1{position:relative;z-index:1;margin:0;font-weight:700;font-size:clamp(34px,9vw,64px);letter-spacing:.01em;line-height:1;
        text-shadow:0 3px 0 #4a2b0f,3px 0 0 #4a2b0f,-3px 0 0 #4a2b0f,0 -3px 0 #4a2b0f,3px 3px 0 #4a2b0f,-3px 3px 0 #4a2b0f,3px -3px 0 #4a2b0f,-3px -3px 0 #4a2b0f,0 8px 0 rgba(74,43,15,.35)}
      #splash .track{position:relative;z-index:1;width:min(64vw,320px);height:20px;border-radius:12px;background:#5a3820;border:3px solid #4a2b0f;box-shadow:0 3px 0 rgba(74,43,15,.35);overflow:hidden}
      #splash .bar{height:100%;width:6%;border-radius:8px;background:linear-gradient(to bottom,#b6ec6c,#6cc23a);transition:width .4s ease-out}
      #splash .msg{position:relative;z-index:1;min-height:1.3em;font-size:clamp(14px,3.6vw,18px);font-weight:500;color:#2d4a1a;text-shadow:0 1px 0 rgba(255,255,255,.7)}
      @keyframes splash-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
      @keyframes splash-grow{0%,100%{transform:scale(.88)}50%{transform:scale(1.04)}}
      @media (prefers-reduced-motion:reduce){#splash .plant,#splash .leaf{animation:none}#splash{transition:none}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="hill back"></div><div class="hill"></div>
      <div class="plant" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <ellipse cx="50" cy="92" rx="30" ry="8" fill="#8a5527" stroke="#4a2b0f" stroke-width="3"/>
          <path d="M50 90 C50 70 50 56 50 44" stroke="#4a2b0f" stroke-width="9" stroke-linecap="round" fill="none"/>
          <path d="M50 90 C50 70 50 56 50 44" stroke="#6cc23a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <path class="leaf" d="M50 52 C30 54 14 44 12 24 C34 22 50 34 50 52Z" fill="#7fd24a" stroke="#4a2b0f" stroke-width="3.5" stroke-linejoin="round"/>
          <path class="leaf b" d="M50 46 C70 48 86 38 88 18 C66 16 50 28 50 46Z" fill="#98e05f" stroke="#4a2b0f" stroke-width="3.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Lucky Harvest</h1>
      <div class="track"><div class="bar" id="splash-bar"></div></div>
      <div class="msg" id="splash-msg">Preparando a terra…</div>
    </div>
    <div id="game"></div>
    <div id="hud">
      <div class="hud-top">
        <div class="hud-left">
          <div class="hud-stats">
            <div class="badge level">
              <div class="lvl"><span class="star" data-icon="star"></span><span class="label">Nível</span><span id="hud-level" class="num">1</span></div>
              <div class="xpbar"><div class="fill" id="hud-xp-fill"></div></div>
              <div class="xptext" id="hud-xp-text">0/50 XP</div>
            </div>
            <div class="badge coins"><span class="coin" data-icon="coin"></span><span id="hud-coins" class="num">0</span></div>
          </div>
          <button type="button" id="goal-chip" class="goal-chip" hidden></button>
          <div class="clock" aria-label="Hora do dia"><span class="clock-icon" id="hud-clock-icon"></span><span id="hud-time">09:00</span></div>
        </div>
        <div class="hud-right">
          <button type="button" id="shop-btn" class="shop-btn" aria-label="Abrir a loja">
            <span class="shop-pic" data-icon="shop"></span><span class="shop-label">Loja</span>
          </button>
          <div class="hud-round">
            <button type="button" id="book-btn" class="round-btn" aria-label="Livro da Fazenda" title="Livro da Fazenda"><span class="dot" hidden></span></button>
            <button type="button" id="sound-btn" class="round-btn" aria-label="Som" title="Som"></button>
            <button type="button" id="menu-btn" class="round-btn" aria-label="Menu" title="Menu"></button>
          </div>
        </div>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div class="hud-bottom">
        <div class="hud-tile" id="hud-tile">Toque num terreno</div>
        <div id="seed-tray" hidden></div>
        <div id="toolbar"></div>
      </div>
      <div class="hud-hint">Toque no celeiro e nos abrigos · Arraste: mover · Pinça: zoom</div>
    </div>
    <div id="floaters"></div>
    <div id="tip" role="tooltip" hidden></div>
    <div id="shop" hidden></div>
    <div id="barn" hidden></div>
    <div id="pen" hidden></div>
    <div id="tonico" hidden></div>
    <div id="bakery" hidden></div>
    <div id="book" hidden></div>
    <div id="menu" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
